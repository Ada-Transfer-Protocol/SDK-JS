<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdaTP WebSocket Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #log {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .msg {
            margin: 5px 0;
        }

        .sent {
            color: blue;
        }

        .received {
            color: green;
        }
    </style>
</head>

<body>
    <h2>AdaTP WebSocket Tester</h2>
    <div id="status">Status: Disconnected</div>
    <div id="log"></div>
    <input type="text" id="input" placeholder="Type a message..." disabled>
    <button id="btn" disabled>Send</button>

    <script type="module">
        import { AdaTPClient } from './src/client.js';

        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const input = document.getElementById('input');
        const btn = document.getElementById('btn');

        function addLog(text, type) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerText = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        // Connect to local server
        const client = new AdaTPClient('ws://127.0.0.1:3000/ws');

        client.onConnect = () => {
            status.innerText = "Status: Connected";
            status.style.color = "green";
            input.disabled = false;
            btn.disabled = false;
            addLog("System: Connected to Server", "received");

            // Authenticate (Mock)
            client.authenticate("WebTester", "pass");
        };

        client.onDisconnect = () => {
            status.innerText = "Status: Disconnected";
            status.style.color = "red";
            input.disabled = true;
            btn.disabled = true;
            addLog("System: Disconnected", "received");
        };

        client.onMessage = (msg) => {
            addLog("Server: " + msg, "received");
        };

        async function connect() {
            try {
                await client.connect();
            } catch (e) {
                addLog("Error: " + e, "received");
            }
        }

        btn.onclick = () => {
            const txt = input.value;
            if (txt) {
                client.sendTextMessage(txt);
                addLog("Me: " + txt, "sent");
                input.value = "";
            }
        };

        input.onkeypress = (e) => {
            if (e.key === 'Enter') btn.onclick();
        };

        // Auto Connect
        connect();

    </script>
</body>

</html>
