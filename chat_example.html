<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AdaTP Chat Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #6200ea;
            color: white;
            padding: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            font-size: 0.9rem;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .msg.me {
            background: #6200ea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg.other {
            background: white;
            border: 1px solid #eee;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg.sys {
            background: transparent;
            color: #888;
            text-align: center;
            align-self: center;
            font-size: 0.8rem;
            box-shadow: none;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: white;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6200ea;
        }

        button {
            background: #6200ea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        button:hover {
            background: #5000cc;
        }

        button:disabled {
            background: #ccc;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="header">
            <div>AdaTP Chat</div>
            <div class="status" id="status">Connecting...</div>
        </div>
        <div class="messages" id="msgs"></div>
        <div class="input-area">
            <input type="text" id="inp" placeholder="Type a message..." disabled
                onkeypress="if(event.key==='Enter') send()">
            <button id="btn" onclick="send()" disabled>➤</button>
        </div>
    </div>

    <script type="module">
        import { AdaTPChat } from './dist/adatp.js';

        const client = new AdaTPChat("wss://adatp.cengizakcan.com/ws");

        // --- EVENTS ---

        client.on('connect', () => {
            document.getElementById('status').innerText = "Online";
            document.getElementById('inp').disabled = false;
            document.getElementById('btn').disabled = false;

            // Auto Join
            client.join("general");
            addMsg("System", "Joined #general", "sys");
        });

        client.on('message', (text, senderId) => {
            if (senderId === client.getMyId()) return;
            addMsg("User", text, "other");
        });

        client.on('user_joined', (sid) => addMsg("System", `User ${sid.substr(0, 4)} joined.`, "sys"));
        client.on('user_left', (sid) => addMsg("System", `User ${sid.substr(0, 4)} left.`, "sys"));

        client.on('disconnect', () => {
            document.getElementById('status').innerText = "Disconnected";
            addMsg("System", "Connection Lost", "sys");
        });

        // --- ACTIONS ---

        window.send = () => {
            const el = document.getElementById('inp');
            const txt = el.value.trim();
            if (txt) {
                client.say(txt);
                addMsg("Me", txt, "me");
                el.value = "";
            }
        };

        function addMsg(user, text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            document.getElementById('msgs').appendChild(div);
            div.scrollIntoView({ behavior: "smooth" });
        }

        // Start Connection (with username/pass)
        client.connect("ChatUser", "1234");
    </script>
</body>

</html>
